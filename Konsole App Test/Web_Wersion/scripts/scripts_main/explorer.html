<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EXPR</title>
</head>
<body>
    <input id="explr" type="file" />
</body>
<script>
    const opl = document.getElementById("explr");

    if (opl) {
        opl.src = URL.createObjectURL(opl);
        opl.play();
    }
</script>
</html>
